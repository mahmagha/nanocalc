<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NanoCalc</title>
  <meta name="description" content="Step-by-step calculations and characterization analysis for nanomaterials, with citations for every equation.">
  <!-- KaTeX for LaTeX equations: local copy (vendor/katex, verified against npm and cdnjs), works offline.
       If it is ever missing, formulas fall back to plain text. -->
  <link rel="stylesheet" href="vendor/katex/0.16.11/katex.min.css">
  <script src="vendor/katex/0.16.11/katex.min.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/plot.css">
  <link rel="stylesheet" href="css/protocols.css">
  <link rel="stylesheet" href="css/designer.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f6f7a">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#/">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="16" r="5" fill="currentColor"/><circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="28" cy="16" r="2.4" fill="currentColor"/><circle cx="7.5" cy="7.5" r="2" fill="currentColor"/></svg>
      <span>NanoCalc</span>
    </a>
    <div class="search" role="search">
      <input id="search" type="search" placeholder="Search calculators, protocols, references…" aria-label="Search the site" autocomplete="off"
        role="combobox" aria-expanded="false" aria-controls="searchPanel" aria-autocomplete="list" aria-keyshortcuts="Control+K /">
      <kbd class="search-key" aria-hidden="true">Ctrl K</kbd>
      <div id="searchPanel" class="search-panel" role="listbox" aria-label="Search results" hidden></div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>
    </button>
  </header>
  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Calculators"></nav>
    <div class="scrim" id="scrim"></div>
    <main id="main" tabindex="-1"></main>
  </div>

  <script src="js/core.js"></script>
  <script src="js/references.js"></script>
  <script src="js/plot.js"></script>
  <script src="js/tex.js"></script>
  <script src="js/units.js"></script>
  <script src="js/uncertainty.js"></script>

  <script src="js/calculators/size-effects.js"></script>

  <script src="js/calculators/colloid.js"></script>
  <script src="js/calculators/scattering.js"></script>
  <script src="js/calculators/surface.js"></script>
  <script src="js/calculators/porosity.js"></script>
  <script src="js/calculators/microscopy.js"></script>
  <script src="js/calculators/spectro.js"></script>

  <script src="js/calculators/thermal.js"></script>

  <script src="js/library.js"></script>
  <script src="js/protocols.js"></script>
  <script src="js/protocols-view.js"></script>
  <script src="js/designer.js"></script>
